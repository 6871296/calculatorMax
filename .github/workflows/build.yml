name: Build Executables

on:
  push:
  release:
    types: [created]

permissions:
  contents: write
  actions: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: calculatormax-linux
            executable: calculatormax
          - os: windows-latest
            artifact_name: calculatormax-windows
            executable: calculatormax.exe
          - os: macos-latest
            artifact_name: calculatormax-macos
            executable: calculatormax

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build with PyInstaller
        run: pyinstaller calculatormax.spec --distpath dist --workpath build

      - name: Upload artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-${{ github.run_number }}
          path: dist/${{ matrix.executable }}
          if-no-files-found: error

      - name: Upload release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.executable }}
          tag_name: ${{ github.event.release.tag_name }}
